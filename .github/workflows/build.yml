name: Build Patched mint-notag

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Build ALL upstream releases, oldest to newest'
        type: boolean
        default: false
      tag:
        description: 'Build one specific upstream tag (optional)'
        required: false
        default: ''
      toolchain:
        description: 'Override the Rust nightly (leave blank to use each tag''s own pinned toolchain)'
        required: false
        default: ''

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.check.outputs.tags }}
      newest: ${{ steps.check.outputs.newest }}

    steps:
      - name: Work out which tags to build
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BACKFILL: ${{ inputs.backfill }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UP="https://api.github.com/repos/Strappazzon/drg-mint-notag/releases"
          AUTH="Authorization: Bearer $GH_TOKEN"

          RESPONSE=$(curl -s -w "\n%{http_code}" -H "$AUTH" "$UP/latest")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "GitHub API returned $HTTP_CODE, skipping build"
            echo "tags=[]" >> $GITHUB_OUTPUT
            echo "newest=" >> $GITHUB_OUTPUT
            exit 0
          fi
          NEWEST=$(echo "$BODY" | jq -r '.tag_name')

          if [ -n "$INPUT_TAG" ]; then
            TAGS=$(jq -cn --arg t "$INPUT_TAG" '[$t]')
          elif [ "$BACKFILL" = "true" ]; then
            RESPONSE=$(curl -sS -w "\n%{http_code}" -H "$AUTH" "$UP?per_page=100")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              echo "GitHub releases API returned HTTP $HTTP_CODE"
              echo "$BODY"
              exit 1
            fi

            TAGS=$(echo "$BODY" | jq -ec \
              '[.[] | select(.draft == false)] | sort_by(.published_at) | map(.tag_name)') || {
                echo "ERROR: failed to parse GitHub releases response"
                exit 1
              }
          else
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$NEWEST")
            if [ "$CODE" = "200" ]; then
              TAGS='[]'
            else
              TAGS=$(jq -cn --arg t "$NEWEST" '[$t]')
            fi
          fi

          echo "Newest upstream: $NEWEST"
          echo "Building: $TAGS"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "newest=$NEWEST" >> $GITHUB_OUTPUT

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.tags != '[]'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1   # one at a time so releases are created oldest -> newest
      matrix:
        tag: ${{ fromJson(needs.check-and-build.outputs.tags) }}
        target: [x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu]
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            rust_targets: x86_64-pc-windows-msvc
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y gcc-mingw-w64 libgtk-3-dev

      - name: Download upstream source
        shell: bash
        run: |
          TAG="${{ matrix.tag }}"

          # keep the Oodle DLL from this repo (the tag's source doesn't ship it)
          mkdir -p "$RUNNER_TEMP/keep"
          [ -f oo2core_9_win64.dll ] && cp oo2core_9_win64.dll "$RUNNER_TEMP/keep/"

          curl -sSL -o "$RUNNER_TEMP/source.zip" \
            "https://github.com/Strappazzon/drg-mint-notag/archive/refs/tags/$TAG.zip"
          rm -rf "$RUNNER_TEMP/staging"
          7z x "$RUNNER_TEMP/source.zip" -o"$RUNNER_TEMP/staging" -y > /dev/null

          # wipe the checked-out files (keep .git) so the tag's source fully replaces them
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -R "$RUNNER_TEMP"/staging/*/. .
          chmod -R u+w .

          # restore the DLL, or fetch it from the upstream commit if it wasn't in this repo
          if [ -f "$RUNNER_TEMP/keep/oo2core_9_win64.dll" ]; then
            cp "$RUNNER_TEMP/keep/oo2core_9_win64.dll" .
          elif [ ! -f oo2core_9_win64.dll ]; then
            curl -sSLf -o oo2core_9_win64.dll \
              "https://raw.githubusercontent.com/Strappazzon/drg-mint-notag/1e519bf069d519c3614737c2c8a542138c5246f0/oo2core_9_win64.dll" \
              || echo "WARNING: could not get oo2core_9_win64.dll"
          fi
          ls

      - name: Apply patches
        shell: bash
        env:
          INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          UPSTREAM_VERSION="${{ matrix.tag }}"
          VERSION="${UPSTREAM_VERSION#v}"

          # Patch 1: replace pak filename in source code and config
          # Use _P suffix for correct UE4 mod pak load priority
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.md" \) \
            -exec sed -i 's/mods_P\.pak/FSD-WindowsNoEditor099_P.pak/g' {} +

          # Patch 2: replace all github.com repo links
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.md" \) \
            -exec sed -i 's|https://github.com/Strappazzon/drg-mint-notag|https://github.com/un-readable/drg-mint-notag-bypass|g' {} +

          # Patch 3: replace the api.github.com update check URL
          find . -type f -name "*.rs" \
            -exec sed -i 's|api.github.com/repos/Strappazzon/drg-mint-notag|api.github.com/repos/un-readable/drg-mint-notag-bypass|g' {} +

          # Patch 4: toolchain
          if [ -n "$INPUT_TOOLCHAIN" ]; then
            CHAN="$INPUT_TOOLCHAIN"
            printf '[toolchain]\nchannel = "%s"\n' "$CHAN" > rust-toolchain.toml
            echo "Using override toolchain: $CHAN"
          else
            CHAN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | tr -d '\r' | head -n1)
            echo "Using the tag's own toolchain: $CHAN"
          fi
          if [ -z "$CHAN" ]; then
            echo "ERROR: could not determine the Rust toolchain for this tag"
            exit 1
          fi
          echo "MINT_TOOLCHAIN=$CHAN" >> "$GITHUB_ENV"

          # Patch 5: update version to match upstream tag
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Version set to: $VERSION"

          # Patch 6: switch hook DLL from x3daudio1_7.dll to d3d9.dll
          # This frees up x3daudio for use by other mods (e.g. x3daudio HRTF)
          # Steam and Xbox both use d3d9.dll as the injection vector
          sed -i 's/Self::Steam => "x3daudio1_7\.dll"/Self::Steam => "d3d9.dll"/' \
            mint_lib/src/lib.rs

          # Patch 7: replace the stub exports in hook/src/lib.rs
          # Remove the x3daudio stubs and replace with full d3d9 export list
          # The game doesn't use DX9 so these are safe empty stubs
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("hook/src/lib.rs")
          src = p.read_text()

          old_exports = '''// x3daudio1_7.dll
          #[no_mangle]
          #[allow(non_snake_case, unused_variables)]
          extern "system" fn X3DAudioCalculate() {}
          #[no_mangle]
          #[allow(non_snake_case, unused_variables)]
          extern "system" fn X3DAudioInitialize() {}
          
          // d3d9.dll
          #[no_mangle]
          #[allow(non_snake_case, unused_variables)]
          extern "system" fn D3DPERF_EndEvent() {}
          #[no_mangle]
          #[allow(non_snake_case, unused_variables)]
          extern "system" fn D3DPERF_BeginEvent() {}'''

          new_exports = '''// d3d9.dll - full export list so the proxy works correctly
          // DRG uses DX11/DX12 so these are safe empty stubs
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn Direct3DShaderValidatorCreate9() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn PSGPError() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn PSGPSampleTexture() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn D3DPERF_BeginEvent() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn D3DPERF_EndEvent() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn D3DPERF_GetStatus() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn D3DPERF_QueryRepeatFrame() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn D3DPERF_SetMarker() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn D3DPERF_SetOptions() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn D3DPERF_SetRegion() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn DebugSetLevel() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn DebugSetMute() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn Direct3D9EnableMaximizedWindowedModeShim() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn Direct3DCreate9() {}
          #[no_mangle] #[allow(non_snake_case, unused_variables)] extern "system" fn Direct3DCreate9Ex() {}'''

          if old_exports in src:
              src = src.replace(old_exports, new_exports)
              p.write_text(src)
              print("hook/src/lib.rs: replaced x3daudio+d3d9 stubs with full d3d9 exports")
          else:
              print("WARNING: could not find expected export block in hook/src/lib.rs - it may have changed upstream")
              print("Attempting fallback: removing x3daudio exports only")
              src = re.sub(
                  r'// x3daudio1_7\.dll\n(?:#\[.*?\]\n)*extern "system" fn X3DAudioCalculate\(\) \{\}\n(?:#\[.*?\]\n)*extern "system" fn X3DAudioInitialize\(\) \{\}\n\n',
                  '', src)
              p.write_text(src)
          PYEOF

          # Patch 8: update hook pak path to try multiple pak names at runtime
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("hook/src/lib.rs")
          src = p.read_text()

          # The old single pak path lookup - matches both the original and our already-patched version
          old_pak = '''    let pak_path = std::env::current_exe()
                  .ok()
                  .as_deref()
                  .and_then(Path::parent)
                  .and_then(Path::parent)
                  .and_then(Path::parent)
                  .map(|p| p.join("Content/Paks/FSD-WindowsNoEditor099_P.pak"))
                  .context("could not determine pak path")?;
              if !pak_path.exists() {
                  return Ok(());
              }'''

          new_pak = '''    // Try multiple pak names in priority order
              let pak_path = ["FSD-WindowsNoEditor099_P.pak", "FSD-WindowsNoEditor099.pak", "mods_P.pak"]
                  .iter()
                  .find_map(|name| {
                      std::env::current_exe()
                          .ok()
                          .as_deref()
                          .and_then(Path::parent)
                          .and_then(Path::parent)
                          .and_then(Path::parent)
                          .map(|p| p.join(format!("Content/Paks/{}", name)))
                          .filter(|p| p.exists())
                  })
                  .context("could not find any mod pak (tried FSD-WindowsNoEditor099_P.pak, FSD-WindowsNoEditor099.pak, mods_P.pak)")?;'''

          if old_pak in src:
              src = src.replace(old_pak, new_pak)
              p.write_text(src)
              print("hook/src/lib.rs: updated pak path to try multiple names")
          else:
              print("WARNING: could not find expected pak path block - structure may have changed")
          PYEOF

          echo "Verifying patches..."
          grep -r "Strappazzon" --include="*.rs" . && echo "WARNING: Strappazzon refs remain" || echo "repo URLs: OK"
          grep -r "x3daudio1_7" --include="*.rs" . && echo "WARNING: x3daudio refs remain" || echo "x3daudio: OK"
          grep "hook_dll_name" mint_lib/src/lib.rs -A5 | grep -E "Steam|Xbox"

      - name: Repair stale Cargo.lock (v0.2.11 / v0.2.12)
        shell: bash
        run: |
          if ! grep -q '^name = "winresource"$' Cargo.lock; then
            echo "Cargo.lock has no winresource entry - seeding it from upstream v0.2.13"
            curl -sSLf -o Cargo.lock \
              "https://raw.githubusercontent.com/Strappazzon/drg-mint-notag/v0.2.13/Cargo.lock"
          else
            echo "Cargo.lock already complete"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.MINT_TOOLCHAIN }}
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ env.MINT_TOOLCHAIN }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-${{ env.MINT_TOOLCHAIN }}-cargo-

      - name: Install cargo-dist (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.0.7/cargo-dist-installer.sh | sh

      - name: Install cargo-dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.0.7/cargo-dist-installer.ps1 | iex

      - name: Build with cargo-dist
        shell: bash
        run: |
          if ! cargo dist build --tag="${{ matrix.tag }}" --output-format=json \
              --artifacts=local --target=${{ matrix.target }} > dist-manifest.json; then
            echo "cargo-dist failed. Re-running plain cargo build to show the real error:"
            cargo build --profile dist --target ${{ matrix.target }} 2>&1 | tail -n 80 || true
            exit 1
          fi

          mkdir -p dist
          jq -r '.artifacts[]?.path | select(. != null)' dist-manifest.json | tr -d '\r' | while read -r p; do
            p=$(echo "$p" | tr '\\' '/')
            echo "Collecting $p"
            cp "$p" dist/
          done
          ls -la dist

      - name: Add Oodle DLL to Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -f oo2core_9_win64.dll ]; then
            echo "ERROR: oo2core_9_win64.dll not found in workspace"
            exit 1
          fi

          ZIP=$(ls dist/*windows-msvc*.zip | head -n1)
          echo "Zip: $ZIP"

          EXE=$(7z l -slt "$ZIP" | tr -d '\r' | sed -n 's/^Path = //p' | grep -i '\.exe$' | head -n1)
          if [ -z "$EXE" ]; then
            echo "ERROR: no .exe found inside $ZIP"
            7z l "$ZIP"
            exit 1
          fi
          DIR=$(dirname "$EXE")
          echo "Exe is at: $EXE (adding the DLL next to it)"

          mkdir -p "$RUNNER_TEMP/zipfix/$DIR"
          cp oo2core_9_win64.dll "$RUNNER_TEMP/zipfix/$DIR/"
          ZIPABS="$(pwd)/$ZIP"
          (cd "$RUNNER_TEMP/zipfix" && 7z a "$ZIPABS" "$DIR/oo2core_9_win64.dll")

          echo "Final contents:"
          7z l "$ZIP"

      - name: Rename Windows package like upstream (v0.2.11 - v0.2.15)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          case "${{ matrix.tag }}" in
            v0.2.11|v0.2.12|v0.2.13|v0.2.14|v0.2.15) ;;
            *) echo "Keeping cargo-dist asset names for ${{ matrix.tag }}"; exit 0 ;;
          esac

          ZIP=$(ls dist/*windows-msvc*.zip | head -n1)
          DEST="$(pwd)/dist/mint-notag-windows-x86_64.zip"
          W="$RUNNER_TEMP/winpkg"; OUT="$RUNNER_TEMP/winout"
          rm -rf "$W" "$OUT"; mkdir -p "$W" "$OUT"

          7z x "$ZIP" -o"$W" -y > /dev/null
          EXE=$(find "$W" -type f -iname '*.exe' | head -n1)
          if [ -z "$EXE" ]; then echo "ERROR: no .exe in $ZIP"; exit 1; fi

          cp "$EXE" "$OUT/mint-notag.exe"
          find "$W" -type f ! -iname '*.exe' -exec cp {} "$OUT/" \;

          (cd "$OUT" && 7z a -tzip "$DEST" ./* > /dev/null)
          rm -f "$ZIP"

          echo "Final contents:"
          7z l "$DEST"

      - name: Rename Linux package like upstream (v0.2.11 - v0.2.15)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG="${{ matrix.tag }}"
          case "$TAG" in
            v0.2.11|v0.2.12|v0.2.13|v0.2.14|v0.2.15) ;;
            *) echo "Keeping cargo-dist asset names for $TAG"; exit 0 ;;
          esac

          ARCH=$(ls dist/*linux* 2>/dev/null | head -n1)
          if [ -z "$ARCH" ]; then echo "ERROR: no Linux archive in dist/"; ls -la dist; exit 1; fi
          echo "Repackaging $ARCH"

          L="$RUNNER_TEMP/linpkg"; OUT="$RUNNER_TEMP/linout"
          rm -rf "$L" "$OUT"; mkdir -p "$L" "$OUT"

          case "$ARCH" in
            *.zip)    7z x "$ARCH" -o"$L" -y > /dev/null ;;
            *.tar.xz) tar -xJf "$ARCH" -C "$L" ;;
            *.tar.gz) tar -xzf "$ARCH" -C "$L" ;;
            *) echo "ERROR: unsupported archive type: $ARCH"; exit 1 ;;
          esac

          BIN=$(find "$L" -type f -printf '%s %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
          echo "Binary: $BIN"

          cp "$BIN" "$OUT/mint-notag"
          chmod +x "$OUT/mint-notag"

          if [ "$TAG" = "v0.2.11" ]; then
            xz -9 -c "$OUT/mint-notag" > dist/mint-notag-linux-x86_64.xz
          else
            find "$L" -type f ! -path "$BIN" -exec cp {} "$OUT/" \;
            tar -C "$OUT" -cf - . | xz -9 > dist/mint-notag-linux-x86_64.tar.xz
          fi
          rm -f "$ARCH"

          ls -la dist

      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${{ matrix.tag }}"
          curl -s "https://api.github.com/repos/Strappazzon/drg-mint-notag/releases/tags/$TAG" \
            | jq -r '.body // ""' \
            | tr -s '\n' \
            | sed 's/\r//' > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ---
          > **Patched build** — auto-built from upstream [$TAG](https://github.com/Strappazzon/drg-mint-notag/releases/tag/$TAG)
          > Patches applied:
          > - \`mods_P.pak\` → \`FSD-WindowsNoEditor099_P.pak\` (also supports \`FSD-WindowsNoEditor099.pak\` and \`mods_P.pak\`)
          > - Hook DLL: \`x3daudio1_7.dll\` → \`d3d9.dll\` (frees x3daudio for HRTF mods)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: mint-notag-bypass ${{ matrix.tag }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: ${{ matrix.tag == needs.check-and-build.outputs.newest }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
